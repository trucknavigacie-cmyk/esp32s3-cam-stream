# PlatformIO — alternativa k Arduino IDE
#
# Pouzitie:
#   pip install platformio
#   pio run              # build
#   pio run -t upload    # upload
#   pio device monitor   # serial
#
# Alebo VS Code + PlatformIO IDE extension.

[platformio]
default_envs = esp32s3cam
src_dir = ESP32S3_CAM_WEB
include_dir = ESP32S3_CAM_WEB

[env:esp32s3cam]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- KRITICKE: quad flash + OCTAL psram (N16R8) ---
; Default board def je N8 bez PSRAM (qio_qspi) -> PSRAM sa nikdy nezmapuje
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.f_flash             = 80000000L
board_build.f_cpu               = 240000000L

board_upload.flash_size   = 16MB
board_upload.maximum_size = 3145728

; 3MB APP / 9.9MB FATFS — rovnako ako v Arduino IDE
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_SPIRAM_USE_MALLOC=1

upload_speed  = 921600
upload_port   = /dev/ttyACM0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; lib = esp32-camera je sucastou frameworku, netreba extra zavislost
